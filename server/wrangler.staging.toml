name = "instagoon-staging"
main = "src/staging.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
keep_vars = true
routes = [{ pattern = "staging.instagoon.app", custom_domain = true }]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "instagoon-staging"
database_id = "386f836c-5bb7-4eb2-a1b0-87dfd85fa5e6"
migrations_dir = "migrations"

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
PRIMARY_AI_PROVIDER = "deepseek"
DEEPSEEK_MODEL = "deepseek-flash"
CF_AI_MODEL = "@cf/qwen/qwen2.5-coder-32b-instruct"
PUBLIC_ORIGIN = "https://staging.instagoon.app"
STAGING_EMAILS = "jirapat.chumee@gmail.com,taychinsgo@gmail.com"
# AGENT_DEV_SECRET is a plain-text Variable set on the staging dashboard, not a Worker secret (checked on
# the dashboard 2026-11-11). It survives deploys only because keep_vars = true above.
# One-time free energy per new staging account (production uses the default, 30).
FREE_ENERGY_GRANT = "100"
# Staging pays into the real collection account, by the owner's decision on 2026-11-11 (ADR-0018 D3).
# The three values are not in this file because the repo is public (ADR-0018 D1). Set them once with
#   cd server && npx wrangler secret put BANK_NAME   (then BANK_ACCOUNT_NO, BANK_ACCOUNT_NAME)
# keep_vars = true is what lets a value that lives only on the Worker survive the next deploy; wrangler's
# own config schema says a dashboard var missing from the file is otherwise deleted on deploy. Secrets are
# still the right form here: production has no keep_vars, so copying that habit to a var there would lose it.
# shopReady() closes the staging shop while any of the three is missing, which is the fail-safe: no card is
# shown rather than a card pointing at nothing.
# Known consequence the owner accepted: test transfers land in the real bank account and appear as
# unmatchedDeposits in the production daily close, where docs/ACCOUNTING_DAILY_CLOSE.md requires a
# manual credit or refund before the day can be invoiced.
# Fill these with Google's published USD per 1M tokens for the active model group to make
# /api/admin/chat-metrics report estimatedCostUsd. Left unset on purpose: the numbers must come
# from the pricing page, not from a guess. See docs/AI_CHAT_COST_PLAN.md (P0).
# GEMINI_PRICE_IN_PER_M = ""
# GEMINI_PRICE_OUT_PER_M = ""
