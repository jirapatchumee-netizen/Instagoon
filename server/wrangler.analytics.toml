# Read plane for the Cosplay Creator experiment. It is its OWN Worker with its OWN D1 binding name
# (ANALYTICS_DB), so froststory-api can never reach this data even if someone adds a route to it:
# a Worker cannot read a database it has no binding for. analytics-plane-isolation.test.mjs guards
# that this file points at the staging database and at nothing else.
name = "instagoon-analytics"
main = "src/analytics.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "instagoon-staging"
database_id = "386f836c-5bb7-4eb2-a1b0-87dfd85fa5e6"

# No [assets] and no [triggers]: this Worker serves one JSON path and nothing else.
# Reachable only when the owner attaches an entry point, e.g.
#   routes = [{ pattern = "analytics-staging.instagoon.app", custom_domain = true }]

[vars]
# Absent or any other value = 503, so an unconfigured deploy cannot leak numbers.
ANALYTICS_READ_ENABLED = "true"
# Printed in every payload so a chart always says which database it came from.
ANALYTICS_SOURCE = "instagoon-staging"
# Browser origin allowed to call this plane; leave unset until the UI is wired for it.
# ANALYTICS_ALLOWED_ORIGIN = "https://staging.instagoon.app"

# ANALYTICS_EMAILS (who may read) and any future key are Secrets, never vars, because the repo is
# public (ADR-0018 D1):
#   npx wrangler secret put ANALYTICS_EMAILS --config wrangler.analytics.toml
