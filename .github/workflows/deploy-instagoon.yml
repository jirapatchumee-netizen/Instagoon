name: Deploy Instagoon (staging auto, production on approval)

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'content/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-instagoon.yml'
  workflow_dispatch:

jobs:
  staging:
    name: Deploy staging (automatic)
    runs-on: ubuntu-latest
    concurrency:
      group: instagoon-staging
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🛠️ Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🧪 Worker tests (gameplay purity + API)
        run: |
          node --experimental-strip-types --test server/tests/*.test.mjs
          node server/tests/api.mjs

      - name: 🏗️ Build staging
        run: pnpm build:staging

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server'
          wranglerVersion: '4.154.0'
          command: deploy --config wrangler.staging.toml

  production:
    name: Deploy production (needs approval)
    needs: staging
    runs-on: ubuntu-latest
    concurrency:
      group: instagoon-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://instagoon.app
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🛠️ Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build production
        run: pnpm build

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server'
          wranglerVersion: '4.154.0'
          command: deploy
