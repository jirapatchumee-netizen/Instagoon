name: PR check (Instagoon)

# Runs on every PR into main. Nothing is deployed; this is the gate before merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Guardrail check (secrets, private art pipeline, AI zone)
        # The same rules as .githooks/pre-commit, so a skipped local hook cannot reach main.
        run: node scripts/guard-commit.mjs --base "origin/${{ github.base_ref }}"
      - run: pnpm install --no-frozen-lockfile
      - name: Worker tests (gameplay purity, NPC bundle, API)
        run: |
          node --experimental-strip-types --test server/tests/*.test.mjs
          node server/tests/api.mjs
      - name: Build (player + staging login)
        run: pnpm build:staging
